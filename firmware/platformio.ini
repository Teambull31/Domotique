; Workspace PlatformIO : un environnement par "nœud" (pièce / fonction).
; Compiler un nœud :  pio run -e climate     Flasher :  pio run -e climate -t upload
[platformio]
default_envs = climate

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
lib_extra_dirs = lib
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -include secrets.h

[env:climate]
board = esp32dev
build_src_filter = +<../nodes/climate/src/>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
