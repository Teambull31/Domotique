; Un environnement PlatformIO par nœud et par carte :
;   <nœud>     ESP32-DevKitC (ESP32 classique)
;   <nœud>-c3  ESP32-C3-DevKitM/C
;   <nœud>-s3  ESP32-S3-DevKitC-1
; Build : pio run -e air-s3   Flash : pio run -e air-s3 -t upload
; Brochages par carte : lib/DomoCore/src/DomoPins.h
[platformio]
src_dir = nodes
default_envs = climate

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
; Analyse statique : pio check -e <nœud> --skip-packages  (clang-tidy, aussi lancée en CI)
check_tool = clangtidy
check_src_filters = +<nodes/> +<lib/DomoCore/src/>
check_flags = clangtidy: --checks=-*,bugprone-*,clang-analyzer-*,performance-*,-bugprone-easily-swappable-parameters,-bugprone-narrowing-conversions,-bugprone-integer-division
lib_extra_dirs = lib
build_src_filter = -<*>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17

[bme]
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14

[esp32]
board = esp32dev

[c3]
board = esp32-c3-devkitm-1

[s3]
board = esp32-s3-devkitc-1

[climate]
build_src_filter = ${env.build_src_filter} +<climate/>
lib_deps = ${env.lib_deps}
    ${bme.lib_deps}

[env:climate]
extends = climate, esp32

[env:climate-c3]
extends = climate, c3

[env:climate-s3]
extends = climate, s3

[air]
build_src_filter = ${env.build_src_filter} +<air/>
lib_deps = ${env.lib_deps}
    sensirion/Sensirion I2C SCD4x@^0.4.0
    adafruit/Adafruit PM25 AQI Sensor@^2.0.0

[env:air]
extends = air, esp32

[env:air-c3]
extends = air, c3

[env:air-s3]
extends = air, s3

[power]
build_src_filter = ${env.build_src_filter} +<power/>
lib_deps = ${env.lib_deps}
    mandulaj/PZEM-004T-v30@^1.1.2

[env:power]
extends = power, esp32

[env:power-c3]
extends = power, c3

[env:power-s3]
extends = power, s3

[door]
build_src_filter = ${env.build_src_filter} +<door/>

[env:door]
extends = door, esp32

[env:door-c3]
extends = door, c3

[env:door-s3]
extends = door, s3

[leak]
build_src_filter = ${env.build_src_filter} +<leak/>

[env:leak]
extends = leak, esp32

[env:leak-c3]
extends = leak, c3

[env:leak-s3]
extends = leak, s3

[presence]
build_src_filter = ${env.build_src_filter} +<presence/>
lib_deps = ${env.lib_deps}
    ncmreynolds/ld2410@^0.1.4

[env:presence]
extends = presence, esp32

[env:presence-c3]
extends = presence, c3

[env:presence-s3]
extends = presence, s3

[shutters]
build_src_filter = ${env.build_src_filter} +<shutters/>

[env:shutters]
extends = shutters, esp32

[env:shutters-c3]
extends = shutters, c3

[env:shutters-s3]
extends = shutters, s3

[heating]
build_src_filter = ${env.build_src_filter} +<heating/>
lib_deps = ${env.lib_deps}
    ${bme.lib_deps}

[env:heating]
extends = heating, esp32

[env:heating-c3]
extends = heating, c3

[env:heating-s3]
extends = heating, s3
