; Un environnement PlatformIO par nœud.   Build : pio run -e air   Flash : pio run -e air -t upload
[platformio]
src_dir = nodes
default_envs = climate

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
lib_extra_dirs = lib
build_src_filter = -<*>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17

[bme]
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:climate]
board = esp32dev
build_src_filter = ${env.build_src_filter} +<climate/>
lib_deps = ${env.lib_deps}
    ${bme.lib_deps}

[env:air]
board = esp32dev
build_src_filter = ${env.build_src_filter} +<air/>
lib_deps = ${env.lib_deps}
    sensirion/Sensirion I2C SCD4x@^0.4.0
    adafruit/Adafruit PM25 AQI Sensor@^2.0.0

[env:power]
board = esp32dev
build_src_filter = ${env.build_src_filter} +<power/>
lib_deps = ${env.lib_deps}
    mandulaj/PZEM-004T-v30@^1.1.2

[env:door]
board = esp32dev
build_src_filter = ${env.build_src_filter} +<door/>

[env:leak]
board = esp32dev
build_src_filter = ${env.build_src_filter} +<leak/>

[env:presence]
board = esp32dev
build_src_filter = ${env.build_src_filter} +<presence/>
lib_deps = ${env.lib_deps}
    ncmreynolds/ld2410@^0.1.4

[env:shutters]
board = esp32dev
build_src_filter = ${env.build_src_filter} +<shutters/>

[env:heating]
board = esp32dev
build_src_filter = ${env.build_src_filter} +<heating/>
lib_deps = ${env.lib_deps}
    ${bme.lib_deps}
