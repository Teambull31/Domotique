name: homeassistant
on:
  push:
    paths: ['homeassistant/**', '.github/workflows/homeassistant.yml']
  pull_request:
    paths: ['homeassistant/**']
jobs:
  check-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip }
      - run: pip install homeassistant
      - run: homeassistant/check_config.sh
      - run: python homeassistant/test_templates.py
