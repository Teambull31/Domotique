name: panel
on:
  push:
    paths: ['panel/**', 'homeassistant/check_config.sh', '.github/workflows/panel.yml']
  pull_request:
    paths: ['panel/**']
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck panel/kiosque/*.sh homeassistant/check_config.sh
      - run: python3 panel/kiosque/test_panneau_veille.py
  installation:
    # Installation réelle (apt) puis kiosque lancé sans écran : défauts invisibles aux tests unitaires
    # (paquet manquant -> écran noir, détection du navigateur, droits des fichiers)
    name: installation (${{ matrix.systeme }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - systeme: debian:bookworm-slim  # base de Raspberry Pi OS Bookworm et d'Armbian
          - systeme: debian:trixie-slim    # base de Raspberry Pi OS actuel
          - systeme: ubuntu:24.04          # doit être refusé (Chromium en snap)
            attendu: refus
    steps:
      - uses: actions/checkout@v4
      # Runner Ubuntu 24.04 : AppArmor y restreint les espaces de noms utilisateur, nécessaires au bac
      # à sable de Chromium. Propre à la machine de CI (pas à Raspberry Pi OS, Debian, Armbian).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: >
          docker run --rm --privileged -v "$PWD/panel/kiosque:/src:ro" ${{ matrix.systeme }}
          bash /src/essai-installation.sh ${{ matrix.attendu }}
