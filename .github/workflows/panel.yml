name: panel
on:
  push:
    paths: ['panel/**', 'homeassistant/check_config.sh', '.github/workflows/panel.yml']
  pull_request:
    paths: ['panel/**']
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck panel/raspberry/*.sh homeassistant/check_config.sh
      - run: python3 panel/raspberry/test_panneau_veille.py
