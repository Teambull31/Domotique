name: firmware
on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**']
jobs:
  tests:
    name: tests logique (PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install platformio
      - run: pio test -e native
        working-directory: firmware
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [climate, air, power, door, leak, call, presence, shutters, heating, pilote, gate, water, smoke]
        board: ['', '-c3', '-s3']   # ESP32-DevKitC, ESP32-C3, ESP32-S3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install platformio
      - run: pio run -e ${{ matrix.node }}${{ matrix.board }}
        working-directory: firmware
      - name: Analyse statique (clang-tidy)
        if: matrix.board == ''
        run: pio check -e ${{ matrix.node }} --skip-packages --fail-on-defect medium
        working-directory: firmware
