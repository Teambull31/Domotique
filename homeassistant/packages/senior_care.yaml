# Package Home Assistant "tranquillité" pour personnes âgées.
# Copier dans /config/packages/ (homeassistant: packages: !include_dir_named packages).
# ADAPTER À CHAQUE SITE (voir Paramètres > Appareils) :
#   1. les groupes ci-dessous : une seule liste par type de capteur, utilisée par toutes les alertes ;
#   2. les quelques entités uniques : porte d'entrée, CO2 de la chambre, puissance de la cuisson ;
#   3. notify.mobile_app_proche (téléphone du proche aidant).
# Principe : aucune action demandée à la personne âgée ; seul le proche aidant est notifié.
# Alertes urgentes (fuite, inactivité, porte la nuit) : sonnent même en mode silencieux
# (Android : canal alarm_stream ; iOS : alerte critique, à autoriser dans l'app Companion).

input_number:
  senior_inactivity_hours:
    name: Alerte si aucune présence détectée (heures)
    min: 2
    max: 24
    step: 1
    initial: 8
input_boolean:
  senior_alerts_enabled:
    name: Alertes tranquillité actives
    initial: true
  senior_daily_report:
    name: Bilan quotidien du soir
    initial: true

# Bilan de la journée (remis à zéro à minuit)
sensor:
  - platform: history_stats
    name: Présence détectée aujourd'hui
    unique_id: senior_presence_aujourdhui
    entity_id: group.senior_presence
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Ouvertures de la porte aujourd'hui
    unique_id: senior_ouvertures_aujourdhui
    entity_id: binary_sensor.door_entree_ouverture
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"

group:
  senior_presence:
    name: "Tranquillité : radars de présence"
    entities:
      - binary_sensor.presence_salon_presence
      - binary_sensor.presence_chambre_presence
      - binary_sensor.presence_cuisine_presence
  senior_fuites:
    name: "Tranquillité : sondes de fuite"
    entities:
      - binary_sensor.leak_cuisine_fuite
      - binary_sensor.leak_salle_de_bain_fuite
  senior_capteurs_pile:
    name: "Tranquillité : capteurs sur pile"
    entities:
      - binary_sensor.door_entree_ouverture
      - binary_sensor.leak_cuisine_fuite
      - binary_sensor.leak_salle_de_bain_fuite
  senior_piles:
    name: "Tranquillité : niveaux de pile"
    entities:
      - sensor.door_entree_batterie
      - sensor.leak_cuisine_batterie
      - sensor.leak_salle_de_bain_batterie
  senior_defauts:
    name: "Tranquillité : défauts de capteurs"
    entities:
      - binary_sensor.presence_salon_defaut_radar
      - binary_sensor.presence_chambre_defaut_radar
      - binary_sensor.presence_cuisine_defaut_radar
      - binary_sensor.heating_salon_defaut_capteur
      - binary_sensor.climate_salon_defaut_capteur
      - binary_sensor.climate_chambre_defaut_capteur
      - binary_sensor.power_cuisson_defaut_capteur
      - binary_sensor.air_chambre_defaut_capteur
  senior_temperatures:
    name: "Tranquillité : températures des pièces de vie"
    entities:
      - sensor.climate_salon_temperature
      - sensor.climate_chambre_temperature

template:
  # Horodatage de la dernière activité réelle : quelqu'un entre dans une pièce surveillée, quitte la
  # dernière pièce occupée (il était là jusqu'à cet instant : sans ce cas, 8 h passées au salon
  # compteraient depuis l'arrivée et déclencheraient une fausse alerte en partant), ou ouvre la porte.
  # Une coupure WiFi d'un capteur (indisponible -> off) ne compte pas. État conservé au redémarrage.
  - trigger:
      - platform: state
        entity_id: group.senior_presence
        to: "on"
      - platform: state
        entity_id: group.senior_presence
        from: "on"
      - platform: state
        entity_id: binary_sensor.door_entree_ouverture
        to: "on"
    sensor:
      - name: "Dernière activité à la maison"
        unique_id: senior_derniere_activite
        device_class: timestamp
        icon: mdi:account-clock
        state: "{{ now().isoformat() }}"

  - trigger:
      - platform: time_pattern
        minutes: "/10"
      - platform: state
        entity_id: [sensor.derniere_activite_a_la_maison, group.senior_presence]
    binary_sensor:
      - name: "Activité récente à la maison"
        unique_id: senior_activite_recente
        # vrai si une pièce est occupée maintenant, ou si la dernière activité date de moins de N h.
        # Jamais d'activité enregistrée (installation neuve) : considéré actif, pas de fausse alerte.
        state: >
          {% set h = states('input_number.senior_inactivity_hours') | float(8) %}
          {% set last = states('sensor.derniere_activite_a_la_maison') | as_datetime %}
          {{ expand('group.senior_presence') | selectattr('state', 'eq', 'on') | list | count > 0
             or last is none
             or (now() - last).total_seconds() < h * 3600 }}

  - binary_sensor:
      - name: "Fuite d'eau quelque part"
        unique_id: senior_fuite_quelque_part
        device_class: moisture
        state: >
          {{ expand('group.senior_fuites') | selectattr('state', 'eq', 'on') | list | count > 0 }}

# Fuite : alerte immédiate, rappels 5 min puis 15 min après, puis toutes les 30 min, tant que l'eau est là et que le proche n'a pas
# acquitté (Paramètres > Entités > alert.fuite_d_eau > Acquitter, ou carte du tableau de bord).
alert:
  fuite_d_eau:
    name: Fuite d'eau
    entity_id: binary_sensor.fuite_d_eau_quelque_part
    state: "on"
    repeat: [5, 15, 30]
    can_acknowledge: true
    skip_first: false
    title: "Fuite d'eau"
    message: >
      De l'eau est détectée :
      {{ expand('group.senior_fuites') | selectattr('state', 'eq', 'on') | map(attribute='name') | join(', ') }}.
    done_message: "Fuite d'eau : plus d'eau détectée."
    notifiers: [mobile_app_proche]
    data: { ttl: 0, priority: high, channel: alarm_stream, push: { sound: { name: default, critical: 1, volume: 1.0 } } }

# À lancer à l'installation et après chaque changement de téléphone du proche : vérifie que les
# notifications normales ET urgentes (son même en silencieux) arrivent bien.
script:
  senior_test_alertes:
    alias: "Tester les alertes du proche"
    icon: mdi:bell-check
    sequence:
      - service: notify.mobile_app_proche
        data:
          title: "Test 1/2 : notification normale"
          message: "Si vous lisez ceci, les alertes de la maison arrivent bien."
      - delay: "00:00:10"
      - service: notify.mobile_app_proche
        data:
          title: "Test 2/2 : alerte urgente"
          message: "Ce test doit sonner même téléphone en silencieux. Sinon, autoriser les alertes critiques (iOS) ou le canal alarm_stream (Android) dans l'app Home Assistant."
          data: { ttl: 0, priority: high, channel: alarm_stream, push: { sound: { name: default, critical: 1, volume: 1.0 } } }
      - service: persistent_notification.create
        data:
          title: "Test des alertes envoyé"
          message: "2 notifications envoyées au proche à {{ now().strftime('%H:%M') }}. Vérifier avec lui qu'elles sont arrivées et que la 2e a sonné."

automation:
  - alias: "Senior - aucune activité pendant la journée"
    trigger:
      - platform: state
        entity_id: binary_sensor.activite_recente_a_la_maison
        to: "off"
      # passé à "off" pendant la nuit (hors plage horaire) : on alerte dès 9 h
      - platform: time
        at: "09:00:00"
    condition:
      - condition: state
        entity_id: binary_sensor.activite_recente_a_la_maison
        state: "off"
      - condition: state
        entity_id: input_boolean.senior_alerts_enabled
        state: "on"
      - condition: time
        after: "09:00:00"
        before: "21:00:00"
    action:
      - service: notify.mobile_app_proche
        data:
          title: "Pas d'activité détectée"
          message: "Aucune présence détectée à la maison depuis un moment. Un appel serait bienvenu."
          data: { ttl: 0, priority: high, channel: alarm_stream, push: { sound: { name: default, critical: 1, volume: 1.0 } } }

  - alias: "Senior - porte d'entrée ouverte la nuit"
    trigger:
      - platform: state
        entity_id: binary_sensor.door_entree_ouverture
        to: "on"
    condition:
      - condition: time
        after: "22:30:00"
        before: "06:00:00"
    action:
      - service: notify.mobile_app_proche
        data: { title: "Porte d'entrée ouverte", message: "La porte d'entrée vient de s'ouvrir en pleine nuit.", data: { ttl: 0, priority: high, channel: alarm_stream, push: { sound: { name: default, critical: 1, volume: 1.0 } } } }

  - alias: "Senior - CO2 élevé, aérer"
    trigger:
      - platform: numeric_state
        entity_id: sensor.air_chambre_co2
        above: 1500
        for: "00:15:00"
    action:
      - service: notify.mobile_app_proche
        data: { title: "Air confiné", message: "CO2 élevé dans la chambre (> 1500 ppm)." }

  - alias: "Senior - capteur muet, en défaut ou batterie faible"
    trigger:
      - platform: template
        id: pile
        value_template: >
          {{ expand('group.senior_piles') | map(attribute='state') | select('is_number')
             | map('float') | select('lt', 20) | list | count > 0 }}
      # + expire_after (2 h 05) côté capteur ≈ 3 h sans nouvelles
      - platform: template
        id: muet
        value_template: >
          {{ expand('group.senior_capteurs_pile') | selectattr('state', 'eq', 'unavailable') | list | count > 0 }}
        for: "01:00:00"
      # radar en panne (alerte d'inactivité aveugle), sonde morte (thermostat coupé par sécurité,
      # alerte chaud/froid aveugle), compteur ou capteur d'air muet
      - platform: template
        id: defaut
        value_template: >
          {{ expand('group.senior_defauts') | selectattr('state', 'eq', 'on') | list | count > 0 }}
        for: "00:10:00"
    action:
      - service: notify.mobile_app_proche
        data:
          title: "Capteur à vérifier"
          message: >
            {% if trigger.id == 'pile' %}
              {% set ns = namespace(l=[]) %}
              {% for e in expand('group.senior_piles') if e.state | is_number and e.state | float < 20 %}
                {% set ns.l = ns.l + [e.name ~ ' (' ~ e.state ~ ' %)'] %}
              {% endfor %}
              Pile faible : {{ ns.l | join(', ') }}.
            {% elif trigger.id == 'muet' %}
              Hors ligne depuis plus de 3 h : {{ expand('group.senior_capteurs_pile')
                | selectattr('state', 'eq', 'unavailable') | map(attribute='name') | join(', ') }}.
            {% else %}
              En défaut : {{ expand('group.senior_defauts')
                | selectattr('state', 'eq', 'on') | map(attribute='name') | join(', ') }}.
            {% endif %}

  # Nécessite un nœud "power" (pince PZEM) sur le circuit de cuisson, pièce "cuisson".
  - alias: "Senior - plaque de cuisson allumée longtemps"
    trigger:
      - platform: numeric_state
        entity_id: sensor.power_cuisson_puissance
        above: 800
        for: "01:30:00"
    condition:
      - condition: state
        entity_id: input_boolean.senior_alerts_enabled
        state: "on"
    action:
      - service: notify.mobile_app_proche
        data:
          title: "Cuisson allumée depuis 1 h 30"
          message: "La plaque ou le four consomme encore {{ states('sensor.power_cuisson_puissance') }} W. Oubli possible."
          data: { ttl: 0, priority: high, channel: alarm_stream, push: { sound: { name: default, critical: 1, volume: 1.0 } } }

  # Canicule / froid : les personnes âgées ressentent mal la température et ne s'en plaignent pas.
  - alias: "Senior - température du logement trop chaude ou trop froide"
    trigger:
      - platform: template
        id: chaud
        value_template: >
          {{ expand('group.senior_temperatures') | map(attribute='state') | select('is_number')
             | map('float') | select('gt', 28) | list | count > 0 }}
        for: "01:00:00"
      - platform: template
        id: froid
        value_template: >
          {{ expand('group.senior_temperatures') | map(attribute='state') | select('is_number')
             | map('float') | select('lt', 17) | list | count > 0 }}
        for: "01:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.senior_alerts_enabled
        state: "on"
    action:
      - service: notify.mobile_app_proche
        data:
          title: "{{ 'Chaleur' if trigger.id == 'chaud' else 'Froid' }} dans le logement"
          message: >
            {% set ns = namespace(l=[]) %}
            {% for e in expand('group.senior_temperatures') if e.state | is_number
                 and ((trigger.id == 'chaud' and e.state | float > 28) or (trigger.id == 'froid' and e.state | float < 17)) %}
              {% set ns.l = ns.l + [e.name ~ ' : ' ~ e.state ~ ' °C'] %}
            {% endfor %}
            {{ ns.l | join(', ') }} depuis 1 h.
            {{ 'Penser à faire boire, fermer les volets côté soleil.' if trigger.id == 'chaud'
               else 'Vérifier le chauffage.' }}

  - alias: "Senior - porte d'entrée restée ouverte"
    trigger:
      - platform: state
        entity_id: binary_sensor.door_entree_ouverture
        to: "on"
        for: "00:15:00"
    condition:
      - condition: state
        entity_id: input_boolean.senior_alerts_enabled
        state: "on"
    action:
      - service: notify.mobile_app_proche
        data:
          title: "Porte d'entrée ouverte depuis 15 min"
          message: "Oubli, ou départ sans refermer ? Un appel peut lever le doute."
          data: { ttl: 0, priority: high }

  # Les jours sans alerte aussi, le proche sait que tout va bien (et que le système fonctionne).
  - alias: "Senior - bilan quotidien"
    trigger:
      - platform: time
        at: "20:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.senior_daily_report
        state: "on"
    action:
      - service: notify.mobile_app_proche
        data:
          title: "Bilan de la journée"
          message: >
            {% set h = states('sensor.presence_detectee_aujourd_hui') | float(0) %}
            {% set last = states('sensor.derniere_activite_a_la_maison') | as_datetime %}
            Présence détectée : {{ (h | int) }} h {{ '%02d' % ((h % 1) * 60) | int }}.
            Porte d'entrée ouverte {{ states('sensor.ouvertures_de_la_porte_aujourd_hui') | int(0) }} fois.
            Dernière activité : {{ as_local(last).strftime('%H:%M') if last else 'inconnue' }}.
            {% set ns = namespace(l=[]) %}
            {% for e in expand('group.senior_temperatures') if e.state | is_number %}
              {% set ns.l = ns.l + [e.name ~ ' ' ~ e.state ~ ' °C'] %}
            {% endfor %}
            {{ ('Températures : ' ~ ns.l | join(', ') ~ '.') if ns.l else '' }}
            {{ 'Alertes désactivées.' if is_state('input_boolean.senior_alerts_enabled', 'off') else '' }}
