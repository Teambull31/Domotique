# Package Home Assistant "tranquillité" pour personnes âgées.
# Copier dans /config/packages/ (homeassistant: packages: !include_dir_named packages).
# ADAPTER À CHAQUE SITE (voir Paramètres > Appareils) :
#   1. les groupes ci-dessous : une seule liste par type de capteur, utilisée par toutes les alertes ;
#   2. les quelques entités uniques : porte d'entrée, CO2 de la chambre, puissance de la cuisson ;
#   3. les téléphones prévenus : groupe notify « proche_aidant » ci-dessous (plusieurs proches possibles).
# Principe : aucune action demandée à la personne âgée ; seul le proche aidant est notifié.
# Alertes urgentes (fuite, inactivité, porte la nuit) : sonnent même en mode silencieux
# (Android : canal alarm_stream ; iOS : alerte critique, à autoriser dans l'app Companion).

# Proches prévenus : SEUL endroit où choisir les téléphones. Toutes les alertes de ce package passent
# par notify.proche_aidant ; chaque téléphone listé les reçoit toutes (un téléphone éteint ou retiré
# n'empêche pas les autres de recevoir). Nom du service : Paramètres > Applications mobiles, ou
# Outils de développement > Actions, « notify.mobile_app_… ».
notify:
  - platform: group
    name: proche_aidant
    services:
      - action: mobile_app_proche              # ← téléphone du proche aidant
      # - action: mobile_app_telephone_de_papa # ← un 2e proche : décommenter et adapter

# Réglages modifiables par le proche (tableau de bord) : PAS de valeur « initial », qui les remettrait
# à zéro à chaque redémarrage de HA (mise à jour, coupure de courant) : alertes réactivées pendant une
# hospitalisation, seuil modifié perdu. Valeurs par défaut appliquées une seule fois, à l'installation
# (automatisation « réglages par défaut » plus bas).
input_number:
  senior_inactivity_hours:
    name: Alerte si aucune présence détectée (heures)
    min: 2
    max: 24
    step: 1
input_boolean:
  # À couper quand la personne est absente (vacances, hôpital) : coupe les alertes liées à sa présence
  # (inactivité, cuisson, chaud/froid, porte restée ouverte, CO2). Restent TOUJOURS actives : fuite
  # d'eau (dégâts), porte ouverte la nuit (intrusion si la maison est vide), capteurs en panne.
  senior_alerts_enabled:
    name: Alertes tranquillité actives
  senior_daily_report:
    name: Bilan quotidien du soir
  senior_reglages_initialises:
    name: "Tranquillité : réglages par défaut appliqués"
    icon: mdi:cog-check
  # Allumé par le bouton d'appel, éteint par le proche quand il a pris l'appel en compte.
  # Pas de valeur initiale : un appel en cours survit à un redémarrage de HA.
  senior_appel_en_cours:
    name: Appel en cours (éteindre une fois pris en compte)
    icon: mdi:phone-alert

# Bilan de la journée (remis à zéro à minuit)
sensor:
  - platform: history_stats
    name: Présence détectée aujourd'hui
    unique_id: senior_presence_aujourdhui
    entity_id: group.senior_presence
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Ouvertures de la porte aujourd'hui
    unique_id: senior_ouvertures_aujourdhui
    entity_id: binary_sensor.door_entree_ouverture
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"

group:
  senior_presence:
    name: "Tranquillité : radars de présence"
    entities:
      - binary_sensor.presence_salon_presence
      - binary_sensor.presence_chambre_presence
      - binary_sensor.presence_cuisine_presence
  senior_fuites:
    name: "Tranquillité : sondes de fuite"
    entities:
      - binary_sensor.leak_cuisine_fuite
      - binary_sensor.leak_salle_de_bain_fuite
  senior_boutons_appel:
    name: "Tranquillité : boutons d'appel"
    entities:
      - binary_sensor.call_chambre_appel
  senior_capteurs_pile:
    name: "Tranquillité : capteurs sur pile"
    entities:
      - binary_sensor.call_chambre_appel
      - binary_sensor.door_entree_ouverture
      - binary_sensor.leak_cuisine_fuite
      - binary_sensor.leak_salle_de_bain_fuite
  senior_piles:
    name: "Tranquillité : niveaux de pile"
    entities:
      - sensor.call_chambre_batterie
      - sensor.door_entree_batterie
      - sensor.leak_cuisine_batterie
      - sensor.leak_salle_de_bain_batterie
  senior_defauts:
    name: "Tranquillité : défauts de capteurs"
    entities:
      - binary_sensor.presence_salon_defaut_radar
      - binary_sensor.presence_chambre_defaut_radar
      - binary_sensor.presence_cuisine_defaut_radar
      - binary_sensor.heating_salon_defaut_capteur
      - binary_sensor.climate_salon_defaut_capteur
      - binary_sensor.climate_chambre_defaut_capteur
      - binary_sensor.power_cuisson_defaut_capteur
      - binary_sensor.air_chambre_defaut_capteur
      - binary_sensor.gate_entree_manoeuvre_non_confirmee  # portail : ordre (radio) non exécuté
  senior_temperatures:
    name: "Tranquillité : températures des pièces de vie"
    entities:
      - sensor.climate_salon_temperature
      - sensor.climate_chambre_temperature

template:
  # Compteurs de capteurs à vérifier (une alerte à CHAQUE nouveau capteur en problème, pas seulement
  # au premier : une 2e pile faible des semaines après la 1re doit aussi être signalée).
  - sensor:
      - name: "Piles faibles"
        unique_id: senior_piles_faibles
        icon: mdi:battery-alert
        state: >
          {{ expand('group.senior_piles') | map(attribute='state') | select('is_number')
             | map('float') | select('lt', 20) | list | count }}
        attributes:
          noms: >
            {% set ns = namespace(l=[]) %}
            {% for e in expand('group.senior_piles') if e.state | is_number and e.state | float < 20 %}
              {% set ns.l = ns.l + [e.name ~ ' (' ~ e.state ~ ' %)'] %}
            {% endfor %}
            {{ ns.l | join(', ') }}
      # + expire_after (2 h 05) côté capteur : environ 3 h sans nouvelles
      - name: "Capteurs sur pile muets"
        unique_id: senior_capteurs_muets
        icon: mdi:access-point-network-off
        state: >
          {{ expand('group.senior_capteurs_pile') | selectattr('state', 'eq', 'unavailable')
             | selectattr('last_changed', 'lt', now() - timedelta(hours=1)) | list | count }}
        attributes:
          noms: >
            {{ expand('group.senior_capteurs_pile') | selectattr('state', 'eq', 'unavailable')
               | selectattr('last_changed', 'lt', now() - timedelta(hours=1)) | map(attribute='name') | join(', ') }}
      # radar en panne (alerte d'inactivité aveugle), sonde morte (thermostat coupé par sécurité),
      # compteur ou capteur d'air muet ; signalé après 10 min
      - name: "Capteurs en défaut"
        unique_id: senior_capteurs_en_defaut
        icon: mdi:alert-circle-outline
        state: >
          {{ expand('group.senior_defauts') | selectattr('state', 'eq', 'on')
             | selectattr('last_changed', 'lt', now() - timedelta(minutes=10)) | list | count }}
        attributes:
          noms: >
            {{ expand('group.senior_defauts') | selectattr('state', 'eq', 'on')
               | selectattr('last_changed', 'lt', now() - timedelta(minutes=10)) | map(attribute='name') | join(', ') }}

  # Horodatage de la dernière activité réelle : quelqu'un entre dans une pièce surveillée, quitte la
  # dernière pièce occupée (il était là jusqu'à cet instant : sans ce cas, 8 h passées au salon
  # compteraient depuis l'arrivée et déclencheraient une fausse alerte en partant), ou ouvre la porte.
  # Une coupure WiFi d'un capteur (indisponible -> off) ne compte pas. État conservé au redémarrage.
  - trigger:
      - platform: state
        entity_id: group.senior_presence
        to: "on"
      - platform: state
        entity_id: group.senior_presence
        from: "on"
      - platform: state
        entity_id: binary_sensor.door_entree_ouverture
        from: "off"  # vraie ouverture (pas un retour d'"indisponible" porte déjà ouverte)
        to: "on"
    sensor:
      - name: "Dernière activité à la maison"
        unique_id: senior_derniere_activite
        device_class: timestamp
        icon: mdi:account-clock
        state: "{{ now().isoformat() }}"

  - trigger:
      - platform: time_pattern
        minutes: "/10"
      - platform: state
        entity_id: [sensor.derniere_activite_a_la_maison, group.senior_presence]
    binary_sensor:
      - name: "Activité récente à la maison"
        unique_id: senior_activite_recente
        # vrai si une pièce est occupée maintenant, ou si la dernière activité date de moins de N h.
        # Jamais d'activité enregistrée (installation neuve) : considéré actif, pas de fausse alerte.
        state: >
          {% set h = states('input_number.senior_inactivity_hours') | float(8) %}
          {% set last = states('sensor.derniere_activite_a_la_maison') | as_datetime %}
          {{ expand('group.senior_presence') | selectattr('state', 'eq', 'on') | list | count > 0
             or last is none
             or (now() - last).total_seconds() < h * 3600 }}

  - binary_sensor:
      # Inactivité à signaler au proche : pas d'activité récente, alertes actives, entre 9 h et 21 h
      # (la nuit, l'absence de mouvement est normale ; si elle dure, l'alerte part à 9 h).
      - name: "Inactivité à signaler"
        unique_id: senior_inactivite_a_signaler
        state: >
          {{ is_state('binary_sensor.activite_recente_a_la_maison', 'off')
             and is_state('input_boolean.senior_alerts_enabled', 'on')
             and today_at('09:00') <= now() < today_at('21:00') }}
      - name: "Fuite d'eau quelque part"
        unique_id: senior_fuite_quelque_part
        device_class: moisture
        # Une sonde qui se tait PENDANT une fuite (eau sur le boîtier, pile noyée) ne doit pas faire
        # croire que l'eau est partie : déjà en alerte, on le reste tant qu'une sonde est muette.
        state: >
          {% set sondes = expand('group.senior_fuites') %}
          {{ sondes | selectattr('state', 'eq', 'on') | list | count > 0
             or (this.state == 'on'
                 and sondes | selectattr('state', 'in', ['unavailable', 'unknown']) | list | count > 0) }}

# Fuite : alerte immédiate, rappels 5 min puis 15 min après, puis toutes les 30 min, tant que l'eau est là et que le proche n'a pas
# acquitté (Paramètres > Entités > alert.fuite_d_eau > Acquitter, ou carte du tableau de bord).
alert:
  # Bouton d'appel : 1re notification par l'automatisation (avec le nom du bouton), puis rappel toutes
  # les 5 min tant que « Appel en cours » n'est pas éteint. Toujours actif, même alertes coupées.
  appel:
    name: Appel à l'aide
    entity_id: input_boolean.senior_appel_en_cours
    state: "on"
    repeat: 5
    can_acknowledge: true
    skip_first: true
    title: "Appel à l'aide (rappel)"
    message: >
      Le bouton d'appel a été pressé à
      {{ as_local(states.input_boolean.senior_appel_en_cours.last_changed).strftime('%H:%M') }}.
      Pas encore pris en compte : appeler, puis éteindre « Appel en cours ».
    # Neutre : l'appel peut avoir été éteint par le proche OU annulé depuis l'écran (appui par erreur)
    done_message: "Appel à l'aide terminé (« Appel en cours » éteint)."
    notifiers: [proche_aidant]
    data: { ttl: 0, priority: high, channel: alarm_stream, push: { sound: { name: default, critical: 1, volume: 1.0 } } }

  # Inactivité : alerte immédiate puis rappel toutes les heures tant que personne n'a acquitté
  # (un appel sans réponse, une notification balayée ne doivent pas clore le sujet).
  inactivite:
    name: Aucune activité détectée
    entity_id: binary_sensor.inactivite_a_signaler
    state: "on"
    repeat: 60
    can_acknowledge: true
    skip_first: false
    title: "Pas d'activité détectée"
    message: >
      {% set last = states('sensor.derniere_activite_a_la_maison') | as_datetime %}
      Aucune présence détectée depuis {{ states('input_number.senior_inactivity_hours') | int(8) }} h
      {{- (' (dernière activité à ' ~ as_local(last).strftime('%H:%M') ~ ')') if last else '' }}.
      Un appel est conseillé.
    done_message: >
      {{ 'Activité de nouveau détectée à la maison.' if is_state('binary_sensor.activite_recente_a_la_maison', 'on')
         else 'Fin de la surveillance de jour (21 h ou alertes coupées) : toujours aucune activité détectée.' }}
    notifiers: [proche_aidant]
    data: { ttl: 0, priority: high, channel: alarm_stream, push: { sound: { name: default, critical: 1, volume: 1.0 } } }

  fuite_d_eau:
    name: Fuite d'eau
    entity_id: binary_sensor.fuite_d_eau_quelque_part
    state: "on"
    repeat: [5, 15, 30]
    can_acknowledge: true
    skip_first: false
    title: "Fuite d'eau"
    message: >
      De l'eau est détectée :
      {{ expand('group.senior_fuites') | selectattr('state', 'eq', 'on') | map(attribute='name') | join(', ') }}.
    done_message: "Fuite d'eau : plus d'eau détectée par les sondes."
    notifiers: [proche_aidant]
    data: { ttl: 0, priority: high, channel: alarm_stream, push: { sound: { name: default, critical: 1, volume: 1.0 } } }

# À lancer à l'installation et après chaque changement de téléphone du proche : vérifie que les
# notifications normales ET urgentes (son même en silencieux) arrivent bien.
script:
  senior_test_alertes:
    alias: "Tester les alertes du proche"
    icon: mdi:bell-check
    sequence:
      - service: notify.proche_aidant
        data:
          title: "Test 1/2 : notification normale"
          message: "Si vous lisez ceci, les alertes de la maison arrivent bien."
      - delay: "00:00:10"
      - service: notify.proche_aidant
        data:
          title: "Test 2/2 : alerte urgente"
          message: "Ce test doit sonner même téléphone en silencieux. Sinon, autoriser les alertes critiques (iOS) ou le canal alarm_stream (Android) dans l'app Home Assistant."
          data: { ttl: 0, priority: high, channel: alarm_stream, push: { sound: { name: default, critical: 1, volume: 1.0 } } }
      - service: persistent_notification.create
        data:
          title: "Test des alertes envoyé"
          message: "2 notifications envoyées au proche à {{ now().strftime('%H:%M') }}. Vérifier avec lui qu'elles sont arrivées et que la 2e a sonné."

  # Bouton « J'ai appuyé par erreur » de l'écran de la personne : annule l'appel ET prévient le proche
  # (sans rappel déjà envoyé, l'alerte s'arrêterait sans message : le proche ne saurait pas pourquoi).
  senior_appel_annule:
    alias: "Appel à l'aide : appui par erreur"
    icon: mdi:phone-cancel
    sequence:
      - condition: state
        entity_id: input_boolean.senior_appel_en_cours
        state: "on"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.senior_appel_en_cours
      - service: notify.proche_aidant
        data:
          title: "Appel annulé depuis l'écran"
          message: >
            « J'ai appuyé par erreur » touché sur l'écran de la maison à {{ now().strftime('%H:%M') }}.
            Un appel pour vérifier que tout va bien reste conseillé.

automation:
  # Première installation seulement (témoin éteint) : alertes et bilan actifs, seuil 8 h. Ensuite, les
  # réglages du proche sont conservés d'un redémarrage à l'autre.
  - alias: "Senior - réglages par défaut (première installation)"
    trigger:
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.senior_reglages_initialises
        state: "off"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: [input_boolean.senior_alerts_enabled, input_boolean.senior_daily_report]
      - service: input_number.set_value
        target:
          entity_id: input_number.senior_inactivity_hours
        data:
          value: 8
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.senior_reglages_initialises

  # Toujours active, même alertes coupées : quelqu'un demande de l'aide.
  - alias: "Senior - bouton d'appel"
    trigger:
      - platform: state
        entity_id: group.senior_boutons_appel
        to: "on"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.senior_appel_en_cours
      - service: notify.proche_aidant
        data:
          title: "Appel à l'aide"
          message: >
            {{ expand('group.senior_boutons_appel') | selectattr('state', 'eq', 'on')
               | map(attribute='name') | join(', ') or 'Bouton d\'appel' }} : appui à {{ now().strftime('%H:%M') }}.
            Appeler, puis éteindre « Appel en cours » sur le tableau de bord.
          data: { ttl: 0, priority: high, channel: alarm_stream, push: { sound: { name: default, critical: 1, volume: 1.0 } } }

  # Toujours active, même alertes coupées : la nuit, une maison vide dont la porte s'ouvre = intrusion.
  - alias: "Senior - porte d'entrée ouverte la nuit"
    trigger:
      - platform: state
        entity_id: binary_sensor.door_entree_ouverture
        # vraie ouverture : capteur sur pile revenu d'"indisponible" (ou HA redémarré) alors que la
        # porte était déjà ouverte = pas d'alerte "vient de s'ouvrir"
        from: "off"
        to: "on"
    condition:
      - condition: time
        after: "22:30:00"
        before: "06:00:00"
    action:
      - service: notify.proche_aidant
        data: { title: "Porte d'entrée ouverte", message: "La porte d'entrée vient de s'ouvrir en pleine nuit.", data: { ttl: 0, priority: high, channel: alarm_stream, push: { sound: { name: default, critical: 1, volume: 1.0 } } } }

  - alias: "Senior - CO2 élevé, aérer"
    trigger:
      - platform: numeric_state
        entity_id: sensor.air_chambre_co2
        above: 1500
        for: "00:15:00"
    condition:
      - condition: state
        entity_id: input_boolean.senior_alerts_enabled
        state: "on"
    action:
      - service: notify.proche_aidant
        data: { title: "Air confiné", message: "CO2 élevé dans la chambre (> 1500 ppm)." }

  - alias: "Senior - capteur muet, en défaut ou batterie faible"
    trigger:
      - platform: state
        entity_id: [sensor.piles_faibles, sensor.capteurs_sur_pile_muets, sensor.capteurs_en_defaut]
    condition:
      # un capteur de plus en problème (pas au redémarrage de HA : from inconnu)
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}
    action:
      - service: notify.proche_aidant
        data:
          title: "Capteur à vérifier"
          message: >
            {% set libelle = {'sensor.piles_faibles': 'Pile faible', 'sensor.capteurs_sur_pile_muets': 'Hors ligne depuis plus de 3 h', 'sensor.capteurs_en_defaut': 'En défaut'} %}
            {{ libelle[trigger.entity_id] }} : {{ trigger.to_state.attributes.noms }}.

  # Nécessite un nœud "power" (pince PZEM) sur le circuit de cuisson, pièce "cuisson".
  - alias: "Senior - plaque de cuisson allumée longtemps"
    trigger:
      - platform: numeric_state
        entity_id: sensor.power_cuisson_puissance
        above: 800
        for: "01:30:00"
    condition:
      - condition: state
        entity_id: input_boolean.senior_alerts_enabled
        state: "on"
    action:
      - service: notify.proche_aidant
        data:
          title: "Cuisson allumée depuis 1 h 30"
          message: "La plaque ou le four consomme encore {{ states('sensor.power_cuisson_puissance') }} W. Oubli possible."
          data: { ttl: 0, priority: high, channel: alarm_stream, push: { sound: { name: default, critical: 1, volume: 1.0 } } }

  # Canicule / froid : les personnes âgées ressentent mal la température et ne s'en plaignent pas.
  - alias: "Senior - température du logement trop chaude ou trop froide"
    trigger:
      - platform: template
        id: chaud
        value_template: >
          {{ expand('group.senior_temperatures') | map(attribute='state') | select('is_number')
             | map('float') | select('gt', 28) | list | count > 0 }}
        for: "01:00:00"
      - platform: template
        id: froid
        value_template: >
          {{ expand('group.senior_temperatures') | map(attribute='state') | select('is_number')
             | map('float') | select('lt', 17) | list | count > 0 }}
        for: "01:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.senior_alerts_enabled
        state: "on"
    action:
      - service: notify.proche_aidant
        data:
          title: "{{ 'Chaleur' if trigger.id == 'chaud' else 'Froid' }} dans le logement"
          message: >
            {% set ns = namespace(l=[]) %}
            {% for e in expand('group.senior_temperatures') if e.state | is_number
                 and ((trigger.id == 'chaud' and e.state | float > 28) or (trigger.id == 'froid' and e.state | float < 17)) %}
              {% set ns.l = ns.l + [e.name ~ ' : ' ~ e.state ~ ' °C'] %}
            {% endfor %}
            {{ ns.l | join(', ') }} depuis 1 h.
            {{ 'Penser à faire boire, fermer les volets côté soleil.' if trigger.id == 'chaud'
               else 'Vérifier le chauffage.' }}

  - alias: "Senior - porte d'entrée restée ouverte"
    trigger:
      - platform: state
        entity_id: binary_sensor.door_entree_ouverture
        to: "on"
        for: "00:15:00"
    condition:
      - condition: state
        entity_id: input_boolean.senior_alerts_enabled
        state: "on"
    action:
      - service: notify.proche_aidant
        data:
          title: "Porte d'entrée ouverte depuis 15 min"
          message: "Oubli, ou départ sans refermer ? Un appel peut lever le doute."
          data: { ttl: 0, priority: high }

  # Les jours sans alerte aussi, le proche sait que tout va bien (et que le système fonctionne).
  - alias: "Senior - bilan quotidien"
    trigger:
      - platform: time
        at: "20:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.senior_daily_report
        state: "on"
    action:
      - service: notify.proche_aidant
        data:
          title: "Bilan de la journée"
          message: >
            {% set h = states('sensor.presence_detectee_aujourd_hui') | float(0) %}
            {% set last = states('sensor.derniere_activite_a_la_maison') | as_datetime %}
            Présence détectée : {{ (h | int) }} h {{ '%02d' % ((h % 1) * 60) | int }}.
            Porte d'entrée ouverte {{ states('sensor.ouvertures_de_la_porte_aujourd_hui') | int(0) }} fois.
            Dernière activité : {{ as_local(last).strftime('%H:%M') if last else 'inconnue' }}.
            {% set ns = namespace(l=[]) %}
            {% for e in expand('group.senior_temperatures') if e.state | is_number %}
              {% set ns.l = ns.l + [e.name ~ ' ' ~ e.state ~ ' °C'] %}
            {% endfor %}
